name = "shakti_lean"
version = "0.1.0"
defaultTargets = ["shakti_lean"]

[[lean_lib]]
name = "ShaktiLean"

[[lean_exe]]
name = "shakti_lean"
root = "Main"
supportInterp = true

# Link against Rust display library
# Built with: cargo build --release -p shakti_display --lib
[[lean_exe.moreServerArgs]]
"--link-flags=-L shakti_display/target/release -l static=shakti_display"
